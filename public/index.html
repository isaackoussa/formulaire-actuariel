<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinguaPro — Anglais pro</title>
<meta name="description" content="Anglais professionnel : finance, droit, comptabilité, banque, assurance, business. Audio, exercices vocaux, dialogues, leçons vidéo et révisions espacées.">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#14213D; --muted:#667085; --line:#E4E7EC;
  --brand:#2F5BEA; --brand-ink:#FFFFFF; --soft:#EEF2FF;
  --good:#12B76A; --good-bg:#E8F8EF; --bad:#F04438; --bad-bg:#FDECEC; --warn:#F79009;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --card:#171C2E; --ink:#EEF1F8; --muted:#98A2B3; --line:#262D44;
    --brand:#6E8BFF; --brand-ink:#0E1220; --soft:#1E2640; --good-bg:#0F2B20; --bad-bg:#33171A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --card:#171C2E; --ink:#EEF1F8; --muted:#98A2B3; --line:#262D44;
  --brand:#6E8BFF; --brand-ink:#0E1220; --soft:#1E2640; --good-bg:#0F2B20; --bad-bg:#33171A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center;justify-content:center}
.hidden{display:none!important}
.row{display:flex;align-items:center} .gap{gap:8px} .wrap{flex-wrap:wrap}

/* Barre supérieure */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:18px;display:flex;gap:6px;align-items:center;margin-right:auto}
.logo i{font-style:normal;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:2px 7px;font-size:14px}
.pill{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--bg)}

main{max-width:760px;margin:0 auto;padding:16px}
.pt{font-size:26px;margin:4px 0 14px} .pt.sm{font-size:21px}
.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;display:block}
a.card{transition:transform .12s} a.card:active{transform:scale(.98)}
.back{display:inline-block;color:var(--muted);font-weight:600;margin-bottom:8px}

.btn{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:12px;padding:11px 18px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:var(--soft);color:var(--ink)} .btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.big{padding:14px 24px;font-size:17px} .btn.wide{width:100%}
.btn.danger{background:var(--bad-bg);color:var(--bad);margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.center-b{display:flex;margin:14px auto 0}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;margin:0 6px 6px 0}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0;color:var(--muted)}

/* Accueil */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 16px}
.hero h1{font-size:28px;margin-bottom:4px}
.goal-ring{--p:0;width:86px;height:86px;flex:none;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*360deg),var(--line) 0);display:grid;place-items:center}
.goal-ring span{width:68px;height:68px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1}
.goal-ring small{font-size:11px;color:var(--muted);font-weight:600}
.daily{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;border:0;padding:18px}
.daily .muted{color:rgba(255,255,255,.8)} .daily .eyebrow{color:rgba(255,255,255,.75)}
.daily-ic{font-size:38px} .daily h2{font-size:22px}
.go{margin-left:auto;width:44px;height:44px;flex:none;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.tile .big{font-size:28px;font-weight:800;line-height:1.1} .tile div{font-weight:700} .tile small{display:block}
.week{display:flex;justify-content:space-between;gap:6px}
.wk{flex:1;text-align:center} .wk small{color:var(--muted);font-size:12px}
.bar{height:70px;background:var(--soft);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.bar i{display:block;width:100%;background:var(--brand);border-radius:8px;min-height:2px} .bar i.full{background:var(--good)}
.domains{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dom{margin:0;border-top:4px solid var(--c)} .dom b{display:block;margin-top:6px} .dom small{display:block;font-size:13px}
.dom-ic{font-size:28px} .dom-ic.xl{font-size:44px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.prog.big{height:10px;flex:1;margin:0}

/* Domaine */
.dhead{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;margin-bottom:12px}
.dhead h1{font-size:24px} .dhead p{margin:4px 0 0;opacity:.85;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tabs a{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabs a.on{background:var(--brand);color:var(--brand-ink)}
.video{display:flex;gap:14px;align-items:center}
.vthumb{width:110px;height:70px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--c),#000);display:grid;place-items:center}
.vthumb span{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-size:14px}
.video b,.video small{display:block}
.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.exl{display:flex;gap:12px;align-items:center;margin:0} .exl>span{font-size:26px;width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--soft);border-radius:12px}
.exl b,.exl small{display:block}
.podcast{display:flex;gap:12px;align-items:center;font-size:26px;margin-top:10px} .podcast b,.podcast small{display:block;font-size:15px} .podcast small{font-size:13px}
.ytl{display:flex;flex-wrap:wrap}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.vrow{display:flex;gap:10px;justify-content:space-between}
.vmain{display:flex;gap:10px;align-items:flex-start}
.def{font-size:14px;color:var(--muted);margin-top:2px}
.ex{font-size:14px;margin-top:6px}
.tag{font-size:12px;background:color-mix(in srgb,var(--c) 18%,transparent);border-radius:8px;padding:2px 8px;height:fit-content;white-space:nowrap}
.dlg b,.dlg small{display:block} .dlg .row{margin-top:10px}

/* Boutons audio */
.spk{width:40px;height:40px;flex:none;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;font-size:18px;transition:transform .1s}
.spk:active{transform:scale(.9)}
.spk.mini{width:26px;height:26px;font-size:11px;vertical-align:middle}
.spk.xl{width:64px;height:64px;font-size:28px;background:var(--brand);color:var(--brand-ink)}
.spk.xxl{width:92px;height:92px;font-size:38px;background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 10px color-mix(in srgb,var(--brand) 18%,transparent)}

/* Session */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{font-size:20px;color:var(--muted);padding:4px}
.qwrap{min-height:50vh}
.prompt{text-align:center;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.prompt h2{font-size:30px} .prompt h2.long{font-size:21px;line-height:1.35;max-width:560px}
.prompt.listen{flex-direction:row;justify-content:center;gap:18px;padding:30px 0}
.sentence{font-size:20px;line-height:1.5;margin:0}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--brand);color:var(--brand);font-weight:700}
.opts{display:grid;gap:10px} .opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:600;text-align:left;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px} .match>div{display:grid;gap:10px} .opt.m{text-align:center;font-size:15px}
textarea{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;padding:12px;margin-bottom:10px}
textarea:focus,.search:focus{outline:none;border-color:var(--brand)}
.built{min-height:62px;border-bottom:2px dashed var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:44px}
.tok{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:600}
.flash{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;text-align:center;margin-bottom:14px}
.fl-front{display:flex;flex-direction:column;align-items:center;gap:12px} .fl-front h2{font-size:32px}
.fl-back{border-top:1px solid var(--line);margin-top:16px;padding-top:16px} .fl-back h3{font-size:22px;color:var(--brand);margin-bottom:6px}
.flash.rv .tag{display:inline-block;margin-bottom:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border-radius:12px;padding:12px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center}
.grades small{font-weight:500;font-size:11px;opacity:.8}
.g1{background:var(--bad-bg);color:var(--bad)} .g3{background:#FEF0C7;color:#93370D} .g4{background:var(--soft);color:var(--brand)} .g5{background:var(--good-bg);color:var(--good)}

.feedback{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.feedback.show{transform:none}
.feedback.good{background:var(--good-bg);border-top:3px solid var(--good)} .feedback.bad{background:var(--bad-bg);border-top:3px solid var(--bad)} .feedback.neutral{background:var(--card);border-top:3px solid var(--brand)}
.fb-in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.fb-txt{font-size:14px;margin-top:4px}
.done{text-align:center;padding:30px 0} .trophy{font-size:64px} .done h2{margin:8px 0 16px}
.stats3{display:flex;justify-content:space-around;text-align:center;gap:8px}
.stats3 b{display:block;font-size:24px} .stats3 small{color:var(--muted);font-size:12px}
.done .stats3{margin-bottom:16px}
.empty{text-align:center;padding:30px 18px} .empty h2{margin:8px 0} .empty .btn{margin-top:12px}

/* Micro */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.mic{width:76px;height:76px;border-radius:50%;background:var(--bad);color:#fff;font-size:32px;box-shadow:0 4px 14px color-mix(in srgb,var(--bad) 40%,transparent)}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.mic-hint{font-size:14px;color:var(--muted)}
.mic-result{text-align:center;width:100%}
.score{font-size:18px;margin-bottom:6px} .score b{font-size:28px}
.score.great b{color:var(--good)} .score.ok b{color:var(--warn)} .score.low b{color:var(--bad)}
.wordmap{font-size:17px;line-height:1.7} .w-ok{color:var(--good);font-weight:600} .w-ko{color:var(--bad);text-decoration:underline wavy;font-weight:600}
.heard{font-size:13px;color:var(--muted)}
.mic-result audio{width:100%;margin:6px 0}

/* Leçon vidéo */
.stage{background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--c) 85%,#fff 0%),#0B0F1C 85%);color:#fff;border-radius:20px;min-height:280px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
@media (min-width:600px){.stage{aspect-ratio:16/10}}
.stage-top{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;opacity:.85}
.stage-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:12px}
.stage-body.in{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.stage-body h2{font-size:clamp(16px,3.6vw,22px);color:#FFD66B}
.karaoke{font-size:clamp(18px,4.6vw,30px);font-weight:700;line-height:1.35;margin:0}
.karaoke span{opacity:.4;transition:opacity .15s}.karaoke span.on{opacity:1}
.sub{margin:0;font-size:clamp(13px,3vw,16px);opacity:.8;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:8px;align-self:flex-start}
.stage-prog{height:4px;background:rgba(255,255,255,.2)} .stage-prog i{display:block;height:100%;background:#FFD66B;transition:width .3s}
.controls{display:flex;justify-content:center;gap:12px;margin:14px 0}

/* Dialogue */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:box-shadow .2s,opacity .2s}
.bub.l{align-self:flex-start;border-bottom-left-radius:4px} .bub.r{align-self:flex-end;border-bottom-right-radius:4px;background:var(--soft)}
.bub small{font-weight:700;color:var(--muted);font-size:12px}
.bub .en{font-weight:600;cursor:pointer} .bub .fr{font-size:13px;color:var(--muted)}
.chat.nofr .fr{display:none}
.bub.me{border:2px dashed var(--brand)}
.bub.cur{box-shadow:0 0 0 3px var(--brand)}
.bub.masked .en{filter:blur(6px)}
.bub .bmic:empty{display:none}

.player{display:flex;gap:16px;align-items:center} .player b,.player small{display:block} .player .row{margin-top:8px}
.player .spk.xxl{width:72px;height:72px;font-size:28px}
.qq .opts{margin-top:10px}
.ts{margin:6px 0}
.rule{background:var(--soft);border:0;font-size:15px}

.pod{text-align:center}
.pod-card{background:linear-gradient(135deg,var(--c),#0B0F1C);color:#fff;border-radius:20px;padding:36px 18px;margin:10px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center}
.pod-card h2{font-size:32px} .pod-card p{margin:8px 0 0} .pod-card .muted{color:rgba(255,255,255,.75)}
.pod .toggle{justify-content:center}

.form label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
.form input:not([type=range]),.form select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.form input[type=range]{width:100%}
.pbar-row{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.pbar-row .prog{margin:0}

/* Navigation */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:10px;min-width:58px}
.nav a span{font-size:22px;line-height:1.1}
.nav a.active{color:var(--brand);background:var(--soft)}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  .pbar-row{grid-template-columns:120px 1fr 36px}
  .prompt h2{font-size:26px}
  .grades button{font-size:13px}
  .vthumb{width:84px;height:56px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a href="#/" class="logo"><i>EN</i> LinguaPro</a>
  <span class="pill" title="Jours consécutifs">🔥 <span id="t-streak">0</span></span>
  <span class="pill" title="Points d'expérience">⭐ <span id="t-xp">0</span></span>
  <span class="ring" id="t-ring" title="Objectif du jour"></span>
</div></header>
<main id="view"></main>
<nav class="nav">
  <a href="#/" data-nav="home"><span>🏠</span>Accueil</a>
  <a href="#/domains" data-nav="domains"><span>📚</span>Domaines</a>
  <a href="#/review" data-nav="review"><span>🔁</span>Révision</a>
  <a href="#/oral" data-nav="oral"><span>🎙️</span>Oral</a>
  <a href="#/profile" data-nav="profile"><span>👤</span>Profil</a>
</nav>
<div id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
